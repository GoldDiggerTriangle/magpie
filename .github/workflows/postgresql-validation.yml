name: Validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/postgresql-validation.yml"
      - "DEPLOYMENT.md"
      - "ROBUSTNESS_EVIDENCE.md"
      - "SPRINT10_EVIDENCE.md"
      - "SPRINT11_SYNC_EVIDENCE.md"
      - "SPRINT11_UI_EVIDENCE.md"
      - "SPRINT12_EVIDENCE.md"
      - "SPRINT13_EVIDENCE.md"
      - "SPRINT14_EVIDENCE.md"
      - "SPRINT15_EVIDENCE.md"
      - "SPRINT16_EVIDENCE.md"
      - "backend/**"
      - "docs/evidence/**"
      - "frontend/**"
      - "scripts/**"
      - "docker-compose.yml"
  pull_request:
    paths:
      - ".github/workflows/postgresql-validation.yml"
      - "DEPLOYMENT.md"
      - "ROBUSTNESS_EVIDENCE.md"
      - "SPRINT10_EVIDENCE.md"
      - "SPRINT11_SYNC_EVIDENCE.md"
      - "SPRINT11_UI_EVIDENCE.md"
      - "SPRINT12_EVIDENCE.md"
      - "SPRINT13_EVIDENCE.md"
      - "SPRINT14_EVIDENCE.md"
      - "SPRINT15_EVIDENCE.md"
      - "SPRINT16_EVIDENCE.md"
      - "backend/**"
      - "docs/evidence/**"
      - "frontend/**"
      - "scripts/**"
      - "docker-compose.yml"

jobs:
  sqlite:
    name: sqlite
    runs-on: ubuntu-24.04

    env:
      DATABASE_URL: sqlite:///db.sqlite3
      SECRET_KEY: django-insecure-ci-sqlite-validation
      DEBUG: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1,192.168.1.86,testserver
      METALS_PROVIDER: fake
      METALS_BASE_CURRENCY: AUD
      METALS_CACHE_TTL_SECONDS: "3600"
      MAGPIE_TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assert old sprint workflows are removed
        run: |
          test -f .github/workflows/postgresql-validation.yml
          if find .github/workflows -maxdepth 1 -type f -name "sprint*-postgres.yml" | grep .; then
            echo "Per-sprint PostgreSQL workflows must be removed."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run Django check
        working-directory: backend
        run: python manage.py check

      - name: Apply SQLite migrations
        working-directory: backend
        run: |
          rm -f db.sqlite3
          python manage.py migrate --noinput

      - name: Check migrations are committed
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run --noinput

      - name: Seed data
        working-directory: backend
        run: python manage.py seed

      - name: Assert marketplace URL-only confinement
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import tokenize

          app_root = Path("backend/apps")
          integration_file = Path("backend/integrations/ebay.py")
          adapter_file = Path("backend/apps/ebay/adapters.py")
          ai_adapter_file = Path("backend/apps/intelligence/ai_adapters.py")
          frontend_root = Path("frontend/src")
          url_builder_files = {
              Path("backend/apps/intelligence/sold_search.py"),
              Path("backend/apps/intelligence/reference_sources.py"),
              Path("backend/apps/research/links.py"),
              Path("backend/apps/research/pricing_sources.py"),
          }
          frontend_view_only_url_files = {
              Path("frontend/src/components/PublishPanel.tsx"),
          }
          suffixes = {".py", ".ts", ".tsx", ".js", ".jsx"}
          network_imports = {"requests", "httpx", "aiohttp"}
          urllib_network_modules = {"urllib.request", "urllib.error"}
          ebay_hosts = [
              "api.ebay.com",
              "api.sandbox.ebay.com",
              "apim.ebay.com",
              "apim.sandbox.ebay.com",
              "apiz.ebay.com",
              "apiz.sandbox.ebay.com",
              "auth.ebay.com",
              "auth.sandbox.ebay.com",
          ]
          marketplace_view_hosts = [
              "www.ebay.com.au",
              "www.facebook.com",
              "www.invaluable.com",
              "www.worthpoint.com",
              "en.numista.com",
              "colnect.com",
              "www.google.com",
          ]

          def is_production_file(path):
              parts = set(path.parts)
              if parts & {"tests", "__pycache__", "migrations", "node_modules", "dist"}:
                  return False
              name = path.name.lower()
              if any(marker in name for marker in [".test.", ".spec."]):
                  return False
              if name.endswith((".md", ".rst", ".txt")):
                  return False
              return path.suffix in suffixes

          def python_imports(path):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          yield alias.name
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      yield node.module

          def text_without_comments(path):
              text = path.read_text(encoding="utf-8", errors="ignore")
              if path.suffix == ".py":
                  lines = []
                  with path.open("rb") as handle:
                      for token in tokenize.tokenize(handle.readline):
                          if token.type in {
                              tokenize.COMMENT,
                              tokenize.ENCODING,
                              tokenize.NL,
                              tokenize.NEWLINE,
                              tokenize.INDENT,
                              tokenize.DEDENT,
                              tokenize.ENDMARKER,
                          }:
                              continue
                          lines.append(token.string)
                  return "\n".join(lines)
              return text

          bad = []
          for path in app_root.rglob("*"):
              if not path.is_file() or not is_production_file(path):
                  continue
              if path in {adapter_file, ai_adapter_file}:
                  continue
              if path.suffix == ".py":
                  for import_name in python_imports(path):
                      root_import = import_name.split(".")[0]
                      if root_import in network_imports or import_name in urllib_network_modules:
                          bad.append(f"{path}: network import {import_name}")
              text = text_without_comments(path)
              for host in ebay_hosts:
                  if host in text:
                      bad.append(f"{path}: eBay hostname {host}")
              for host in marketplace_view_hosts:
                  if host in text and path not in url_builder_files:
                      bad.append(f"{path}: marketplace URL host {host} outside URL-only source registry")

          for path in frontend_root.rglob("*"):
              if not path.is_file() or not is_production_file(path):
                  continue
              text = text_without_comments(path)
              for host in [*ebay_hosts, *marketplace_view_hosts]:
                  if host in text and path not in frontend_view_only_url_files:
                      bad.append(f"{path}: frontend marketplace hostname {host}")

          integration_text = integration_file.read_text(encoding="utf-8")
          adapter_text = adapter_file.read_text(encoding="utf-8")
          if "api.ebay.com" in integration_text:
              bad.append("backend/integrations/ebay.py: legacy shim must not contain eBay HTTP hostnames")
          if "api.ebay.com" not in adapter_text:
              bad.append("backend/apps/ebay/adapters.py: expected eBay HTTP hostnames")
          if "urllib" not in adapter_text or "urlopen" not in adapter_text:
              bad.append("backend/apps/ebay/adapters.py: expected eBay HTTP implementation")
          if bad:
              print("\n".join(bad))
              raise SystemExit("eBay HTTP access must be confined to backend/apps/ebay/adapters.py.")
          PY

      - name: Run backend tests on SQLite
        working-directory: backend
        run: python -m pytest

      - name: Generate CI backup passphrase
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import secrets

          print(f"MAGPIE_BACKUP_PASSPHRASE={secrets.token_urlsafe(48)}")
          PY

      - name: Create encrypted SQLite backup
        working-directory: backend
        run: |
          rm -f db.sqlite3
          python manage.py migrate --noinput
          python manage.py seed
          python manage.py backup --output-dir backups --no-upload

      - name: Restore encrypted SQLite backup into clean target
        working-directory: backend
        run: |
          latest="$(python - <<'PY'
          from pathlib import Path

          print(sorted(Path("backups").glob("magpie-backup-*.tar.gz.enc"))[-1])
          PY
          )"
          python manage.py restore "$latest" --target /tmp/magpie-ci-restore
          python - <<'PY'
          import json
          import os
          import sqlite3
          import tarfile
          from pathlib import Path

          from apps.core.backup_ops import (
              DB_SNAPSHOT_NAME,
              ENV_MANIFEST_NAME,
              MAGIC,
              RESTORE_RUNBOOK_NAME,
              count_key_rows,
              decrypt_file,
              safe_extract_tar,
          )

          backups = sorted(Path("backups").glob("magpie-backup-*.tar.gz.enc"))
          assert backups, "No encrypted backup produced"
          latest = backups[-1]
          assert latest.read_bytes().startswith(MAGIC)

          try:
              tarfile.open(latest, "r:gz")
          except tarfile.ReadError:
              pass
          else:
              raise AssertionError("Encrypted archive opened as plaintext tar")

          extracted = Path("/tmp/magpie-ci-extracted")
          decrypted = Path("/tmp/magpie-ci-backup.tar.gz")
          decrypt_file(latest, decrypted, os.environ["MAGPIE_BACKUP_PASSPHRASE"])
          safe_extract_tar(decrypted, extracted)
          assert (extracted / DB_SNAPSHOT_NAME).exists()
          assert (extracted / "media_files").exists()
          assert (extracted / RESTORE_RUNBOOK_NAME).exists()
          env_manifest = json.loads((extracted / ENV_MANIFEST_NAME).read_text())
          assert "MAGPIE_BACKUP_PASSPHRASE" in env_manifest["env_var_names"]

          restored_db = Path("/tmp/magpie-ci-restore/db.sqlite3")
          restored_media = Path("/tmp/magpie-ci-restore/media_files")
          assert restored_db.exists()
          assert restored_media.exists()
          counts = count_key_rows(restored_db)
          assert counts["items"] == 6
          assert counts["comparables"] == 4
          assert counts["drafts"] == 1
          assert counts["sales"] == 0
          assert counts["ebay_staging"] == 0
          assert counts["ebay_duplicates"] == 0
          assert counts["field_suggestions"] == 0
          assert counts["image_fingerprints"] == 0
          assert counts["ai_credentials"] == 0
          assert counts["ai_research_calls"] == 0
          assert counts["ai_search_terms"] == 0
          assert counts["ai_reference_links"] == 0
          conn = sqlite3.connect(restored_db)
          try:
              assert conn.execute("select count(*) from sales_salerecord").fetchone()[0] == 0
              assert conn.execute("select count(*) from research_comparable").fetchone()[0] == 4
              assert conn.execute("select count(*) from listing_listingdraft").fetchone()[0] == 1
              assert conn.execute("select count(*) from ebay_ebayorderstaging").fetchone()[0] == 0
              assert conn.execute("select count(*) from ebay_ebayorderduplicatecandidate").fetchone()[0] == 0
              assert conn.execute("select count(*) from intelligence_fieldsuggestion").fetchone()[0] == 0
              assert conn.execute("select count(*) from intelligence_imagefingerprint").fetchone()[0] == 0
              assert conn.execute("select count(*) from intelligence_aicredential").fetchone()[0] == 0
              assert conn.execute("select count(*) from intelligence_airesearchcall").fetchone()[0] == 0
              assert conn.execute("select count(*) from intelligence_airesearchsearchterm").fetchone()[0] == 0
              assert conn.execute("select count(*) from intelligence_aireferencelink").fetchone()[0] == 0
          finally:
              conn.close()
          print("Encrypted SQLite backup restore checks passed.")
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Collect production static files
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DEBUG: "0"
        run: python manage.py collectstatic --noinput

      - name: Run deploy check
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DEBUG: "0"
        run: python manage.py check --deploy

      - name: Smoke Waitress and WhiteNoise
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DEBUG: "0"
          MAGPIE_SMOKE_PORT: "8765"
        run: python scripts/production_smoke.py

  postgres:
    name: postgres
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gsp
          POSTGRES_USER: gsp
          POSTGRES_PASSWORD: gsp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gsp -d gsp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://gsp:gsp@127.0.0.1:5432/gsp
      SECRET_KEY: django-insecure-ci-postgresql-validation
      DEBUG: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1,192.168.1.86,testserver
      PGCONNECT_TIMEOUT: "10"
      PGPASSWORD: gsp
      METALS_PROVIDER: fake
      METALS_BASE_CURRENCY: AUD
      METALS_CACHE_TTL_SECONDS: "3600"
      MAGPIE_TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run Django check
        working-directory: backend
        run: python manage.py check

      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Check migrations are committed
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run --noinput

      - name: Seed data
        working-directory: backend
        run: python manage.py seed

      - name: Assert eBay schema and fake eBay adapters
        working-directory: backend
        run: |
          python - <<'PY'
          import os

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.dev")

          import django

          django.setup()

          from django.conf import settings
          from django.db import connection

          from apps.audit.models import AuditLog
          from apps.ebay.models import (
              EbayAccountSnapshot,
              EbayAppToken,
              EbayCredential,
              EbayOrderDuplicateCandidate,
              EbayOrderStaging,
              EbayOrderSyncState,
              MerchantLocation,
              OAuthState,
          )
          from apps.listing.models import ListingBoilerplate, ListingDraft
          from integrations.ebay import (
              FakeEbayAccountAdapter,
              FakeEbayAuthAdapter,
              get_ebay_account_adapter,
              get_ebay_auth_adapter,
          )

          assert connection.vendor == "postgresql", connection.vendor
          assert settings.EBAY_ENV == ""
          assert isinstance(get_ebay_auth_adapter(), FakeEbayAuthAdapter)
          assert isinstance(get_ebay_account_adapter(), FakeEbayAccountAdapter)
          assert EbayCredential.objects.count() == 0
          assert OAuthState.objects.count() == 0
          assert EbayAccountSnapshot.objects.count() == 0
          assert EbayAppToken.objects.count() == 0
          assert EbayOrderDuplicateCandidate.objects.count() == 0
          assert EbayOrderStaging.objects.count() == 0
          assert EbayOrderSyncState.objects.count() == 0
          assert MerchantLocation.objects.count() == 0
          assert AuditLog.objects.count() == 0
          assert ListingBoilerplate.objects.count() == 1
          assert ListingDraft.objects.count() == 1

          expected_tables = {
              "audit_auditlog",
              "ebay_ebaycredential",
              "ebay_oauthstate",
              "ebay_ebayaccountsnapshot",
              "ebay_ebayapptoken",
              "ebay_ebayorderduplicatecandidate",
              "ebay_ebayorderstaging",
              "ebay_ebayordersyncstate",
              "ebay_merchantlocation",
          }
          with connection.cursor() as cursor:
              cursor.execute(
                  """
                  select table_name
                  from information_schema.tables
                  where table_schema = 'public'
                    and table_name = any(%s)
                  """,
                  [list(expected_tables)],
              )
              tables = {row[0] for row in cursor.fetchall()}
          assert tables == expected_tables, tables

          print("Sprint 7 PostgreSQL schema and fake eBay adapter checks passed.")
          PY

      - name: Run backend tests on PostgreSQL
        working-directory: backend
        run: python -m pytest
