name: PostgreSQL Validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/postgresql-validation.yml"
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
  pull_request:
    paths:
      - ".github/workflows/postgresql-validation.yml"
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"

jobs:
  postgresql-validation:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gsp
          POSTGRES_USER: gsp
          POSTGRES_PASSWORD: gsp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gsp -d gsp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://gsp:gsp@127.0.0.1:5432/gsp
      SECRET_KEY: django-insecure-ci-postgresql-validation
      DEBUG: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PGCONNECT_TIMEOUT: "10"
      PGPASSWORD: gsp
      METALS_PROVIDER: fake
      METALS_BASE_CURRENCY: AUD
      METALS_CACHE_TTL_SECONDS: "3600"
      MAGPIE_TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assert old sprint workflows are removed
        run: |
          test -f .github/workflows/postgresql-validation.yml
          if find .github/workflows -maxdepth 1 -type f -name "sprint*-postgres.yml" | grep .; then
            echo "Per-sprint PostgreSQL workflows must be removed."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pg_dump --version

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run Django check
        working-directory: backend
        run: python manage.py check

      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Check migrations are committed
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run --noinput

      - name: Seed data
        working-directory: backend
        run: python manage.py seed

      - name: Assert Sprint 7 schema and fake eBay adapters
        working-directory: backend
        run: |
          python - <<'PY'
          import os

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.dev")

          import django

          django.setup()

          from django.conf import settings
          from django.db import connection

          from apps.audit.models import AuditLog
          from apps.ebay.models import (
              EbayAccountSnapshot,
              EbayAppToken,
              EbayCredential,
              MerchantLocation,
              OAuthState,
          )
          from apps.listing.models import ListingBoilerplate, ListingDraft
          from integrations.ebay import (
              FakeEbayAccountAdapter,
              FakeEbayAuthAdapter,
              get_ebay_account_adapter,
              get_ebay_auth_adapter,
          )

          assert connection.vendor == "postgresql", connection.vendor
          assert settings.EBAY_ENV == ""
          assert isinstance(get_ebay_auth_adapter(), FakeEbayAuthAdapter)
          assert isinstance(get_ebay_account_adapter(), FakeEbayAccountAdapter)
          assert EbayCredential.objects.count() == 0
          assert OAuthState.objects.count() == 0
          assert EbayAccountSnapshot.objects.count() == 0
          assert EbayAppToken.objects.count() == 0
          assert MerchantLocation.objects.count() == 0
          assert AuditLog.objects.count() == 0
          assert ListingBoilerplate.objects.count() == 1
          assert ListingDraft.objects.count() == 1

          expected_tables = {
              "audit_auditlog",
              "ebay_ebaycredential",
              "ebay_oauthstate",
              "ebay_ebayaccountsnapshot",
              "ebay_ebayapptoken",
              "ebay_merchantlocation",
          }
          with connection.cursor() as cursor:
              cursor.execute(
                  """
                  select table_name
                  from information_schema.tables
                  where table_schema = 'public'
                    and table_name = any(%s)
                  """,
                  [list(expected_tables)],
              )
              tables = {row[0] for row in cursor.fetchall()}
          assert tables == expected_tables, tables

          print("Sprint 7 PostgreSQL schema and fake eBay adapter checks passed.")
          PY

      - name: Assert eBay HTTP confinement
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import tokenize

          app_root = Path("backend/apps")
          integration_file = Path("backend/integrations/ebay.py")
          frontend_root = Path("frontend/src")
          suffixes = {".py", ".ts", ".tsx", ".js", ".jsx"}
          network_imports = {"requests", "httpx", "aiohttp", "urllib"}
          ebay_hosts = [
              "api.ebay.com",
              "api.sandbox.ebay.com",
              "apim.ebay.com",
              "apim.sandbox.ebay.com",
              "apiz.ebay.com",
              "apiz.sandbox.ebay.com",
              "auth.ebay.com",
              "auth.sandbox.ebay.com",
          ]

          def is_production_file(path):
              parts = set(path.parts)
              if parts & {"tests", "__pycache__", "migrations", "node_modules", "dist"}:
                  return False
              name = path.name.lower()
              if any(marker in name for marker in [".test.", ".spec."]):
                  return False
              if name.endswith((".md", ".rst", ".txt")):
                  return False
              return path.suffix in suffixes

          def python_imports(path):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          yield alias.name.split(".")[0]
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      yield node.module.split(".")[0]

          def text_without_comments(path):
              text = path.read_text(encoding="utf-8", errors="ignore")
              if path.suffix == ".py":
                  lines = []
                  with path.open("rb") as handle:
                      for token in tokenize.tokenize(handle.readline):
                          if token.type in {
                              tokenize.COMMENT,
                              tokenize.ENCODING,
                              tokenize.NL,
                              tokenize.NEWLINE,
                              tokenize.INDENT,
                              tokenize.DEDENT,
                              tokenize.ENDMARKER,
                          }:
                              continue
                          lines.append(token.string)
                  return "\n".join(lines)
              return text

          bad = []
          for path in app_root.rglob("*"):
              if not path.is_file() or not is_production_file(path):
                  continue
              if path.suffix == ".py":
                  for import_name in python_imports(path):
                      if import_name in network_imports:
                          bad.append(f"{path}: network import {import_name}")
              text = text_without_comments(path)
              for host in ebay_hosts:
                  if host in text:
                      bad.append(f"{path}: eBay hostname {host}")

          for path in frontend_root.rglob("*"):
              if not path.is_file() or not is_production_file(path):
                  continue
              text = text_without_comments(path)
              for host in ebay_hosts:
                  if host in text:
                      bad.append(f"{path}: frontend eBay hostname {host}")

          integration_text = integration_file.read_text(encoding="utf-8")
          if "api.ebay.com" not in integration_text:
              bad.append("backend/integrations/ebay.py: expected eBay HTTP hostnames")
          if bad:
              print("\n".join(bad))
              raise SystemExit("eBay HTTP access must be confined to backend/integrations/ebay.py.")
          PY

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

      - name: Create PostgreSQL backup
        working-directory: backend
        run: python manage.py backup

      - name: Restore PostgreSQL backup into empty database
        run: |
          mkdir -p /tmp/postgresql-validation-restore
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          backups = sorted(Path("backups").glob("backup-*.zip"))
          assert backups, "No backup zip produced"
          latest = backups[-1]

          with zipfile.ZipFile(latest) as archive:
              names = set(archive.namelist())
              assert "manifest.json" in names, names
              assert "media/" in names, names
              assert "db.dump" in names, names
              assert "db.json" not in names, names
              manifest = json.loads(archive.read("manifest.json"))
              archive.extract("db.dump", "/tmp/postgresql-validation-restore")

          assert manifest["database_artifact"] == "db.dump", manifest
          for key in [
              "audit.auditlog",
              "ebay.ebaycredential",
              "ebay.oauthstate",
              "ebay.ebayaccountsnapshot",
              "ebay.ebayapptoken",
              "ebay.merchantlocation",
          ]:
              assert key in manifest["row_counts"], key
          assert manifest["row_counts"]["ebay.ebaycredential"] == 0
          assert manifest["row_counts"]["ebay.ebayapptoken"] == 0
          assert manifest["row_counts"]["ebay.merchantlocation"] == 0
          assert manifest["row_counts"]["listing.listingdraft"] == 1
          print(latest)
          PY
          createdb --host 127.0.0.1 --username gsp gsp_restore
          pg_restore --host 127.0.0.1 --username gsp --dbname gsp_restore /tmp/postgresql-validation-restore/db.dump
          cd backend
          DATABASE_URL=postgres://gsp:gsp@127.0.0.1:5432/gsp_restore python - <<'PY'
          import os

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.dev")

          import django

          django.setup()

          from apps.audit.models import AuditLog
          from apps.ebay.models import (
              EbayAccountSnapshot,
              EbayAppToken,
              EbayCredential,
              MerchantLocation,
              OAuthState,
          )
          from apps.listing.models import ListingBoilerplate, ListingDraft

          assert AuditLog.objects.count() == 0
          assert EbayCredential.objects.count() == 0
          assert OAuthState.objects.count() == 0
          assert EbayAccountSnapshot.objects.count() == 0
          assert EbayAppToken.objects.count() == 0
          assert MerchantLocation.objects.count() == 0
          assert ListingBoilerplate.objects.count() == 1
          assert ListingDraft.objects.count() == 1
          print("PostgreSQL backup restore checks passed.")
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build
