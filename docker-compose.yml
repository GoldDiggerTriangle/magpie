services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gsp
      POSTGRES_USER: gsp
      POSTGRES_PASSWORD: gsp
    ports:
      - "5432:5432"
    volumes:
      - gsp_pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    profiles:
      - tools
    ports:
      - "8080:8080"

volumes:
  gsp_pgdata: {}
